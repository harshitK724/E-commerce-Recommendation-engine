[project]
name = "ecomrec"
version = "0.1.0"
description = "E-commerce recommendation server: PostgreSQL, Pandas, PyTorch MF, FastAPI."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "torch>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
ecomrec = "ecomrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecomrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# CPU wheels only — do not pull NVIDIA CUDA packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
