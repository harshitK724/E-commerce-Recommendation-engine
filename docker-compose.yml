services:
  postgres:
    image: postgres:16
    container_name: ecomrec-postgres
    environment:
      POSTGRES_USER: ecomrec
      POSTGRES_PASSWORD: ecomrec
      POSTGRES_DB: ecomrec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomrec -d ecomrec"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
